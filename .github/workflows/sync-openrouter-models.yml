name: Sync OpenRouter models

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sync-openrouter-models.mjs
      - run: node scripts/generate-model-table.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "(chore) refresh OpenRouter-mirrored model pricing"
          title: "Refresh OpenRouter-mirrored model pricing"
          body: >
            Automated weekly refresh of the `openrouter/*` entries in
            `python/thanos/data/models.json` from OpenRouter's public
            catalog (https://openrouter.ai/api/v1/models), plus the
            regenerated README table. Every hand-curated entry (direct
            provider APIs, `bedrock/*`, `azure/*`) is left untouched —
            review the diff before merging.
          branch: sync/openrouter-models
          delete-branch: true
